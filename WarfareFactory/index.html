<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>[Preview] Warfare Factory</title>
<style>
html,body { margin:0;width:100%;height:100%;overflow:hidden;background:#fff; }
#game { position:fixed;inset:0;display:flex;justify-content:center;align-items:center; }
canvas { width:100%;height:100%;display:block;touch-action:none; }
#status { position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;font:18px sans-serif;color:#333;text-align:center; }
</style>
<script src="./local-fb-sdk.js"></script>
</head><body>
<div id="game"><canvas id="unity-canvas" tabindex="0"></canvas></div>
<div id="status">Loading…</div>
<script>
// 网页负责一次初始化，加载 Unity 完成后才开始平台游戏。
const status = document.getElementById('status');
const canvas = document.getElementById('unity-canvas');
const config = {
 dataUrl:'Build/web.data',
 frameworkUrl:'Build/web.framework.js',
 codeUrl:'Build/web.wasm',
 streamingAssetsUrl:'StreamingAssets',
 companyName:"rongzong",
 productName:"Warfare Factory",
 productVersion:"2.0",
 devicePixelRatio:Math.min(window.devicePixelRatio || 1,2),
 showBanner:(message,type)=>{ if(type==='error') fail(new Error(message)); else console.warn(message); }
};
function fail(error) {
 console.error('[WarfareFactory] Startup failed',error);
 status.style.display='flex';
 status.textContent='Unable to load the game. Please reopen it.';
}
function loadUnity() {
 return new Promise((resolve,reject)=>{
  const script=document.createElement('script');
  script.src='Build/web.loader.js';
  script.onerror=()=>reject(new Error('Unity loader failed'));
  script.onload=()=>createUnityInstance(canvas,config,progress=>{
   FBInstant.setLoadingProgress(Math.round(progress*100));
   status.textContent='Loading… '+Math.round(progress*100)+'%';
  }).then(resolve,reject);
  document.body.appendChild(script);
 });
}
(async()=>{
 if(!window.FBInstant) throw new Error('Facebook Instant Games SDK is unavailable');
 const response=await fetch('./facebook-config.json',{cache:'no-store'});
 if(!response.ok) throw new Error('Facebook config could not be loaded');
 const external=await response.json();
 if(!/^\d+$/.test(external.appId) ||
    ![external.interstitialPlacementId,external.rewardedPlacementId].every(id=>typeof id==='string' && new RegExp('^'+external.appId+'_\\d+$').test(id)))
   throw new Error('Invalid Facebook app or advertising configuration');
 window.warfareFactoryConfig=Object.freeze(external);
 await FBInstant.initializeAsync();
 const playerId=FBInstant.player.getID();
 if(!playerId) throw new Error('Facebook player identity is unavailable');
 window.warfareFactorySaveKey='warfarefactory:'+external.appId+':'+playerId+':v1';
 window.unityInstance=await loadUnity();
 await FBInstant.startGameAsync();
 window.warfareFactoryPlatformReady=true;
 status.style.display='none';
})().catch(fail);
</script></body></html>
